<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
	<title>Login V1</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
<!--===============================================================================================-->	
	<link rel="icon" type="image/png" href="Login_v1/images/icons/favicon.ico"/>
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="Login_v1/vendor/bootstrap/css/bootstrap.min.css">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="Login_v1/fonts/font-awesome-4.7.0/css/font-awesome.min.css">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="Login_v1/vendor/animate/animate.css">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="Login_v1/vendor/css-hamburgers/hamburgers.min.css">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="Login_v1/vendor/select2/select2.min.css">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="Login_v1/vendor/css/util.css">
	<link rel="stylesheet" type="text/css" href="Login_v1/vendor/css/main.css">
<!--===============================================================================================-->
</head>
<body>

	<div class="limiter">
		<div class="container-login100">
			<div class="wrap-login100">
				<div class="login100-pic js-tilt" data-tilt>
					<img src="Login_v1/images/img-01.png" alt="IMG">
				</div>

				<form class="login100-form validate-form" method="post" action="#" th:action="login" th:object="${loginrequest}">
					<span class="login100-form-title">
						Member Login
					</span>

					<div class="wrap-input100 validate-input" data-validate = "Valid email is required: ex@abc.xyz">
						<input class="input100" type="text" name="email" id="email" placeholder="Email" th:field="*{email}">
						<span class="focus-input100"></span>
						<span class="symbol-input100">
        <i class="fa fa-envelope" aria-hidden="true"></i>
    </span>
					</div>

					<div class="wrap-input100 validate-input" data-validate = "Password is required">
						<input class="input100" type="password" name="pass" id="password" placeholder="Password" th:field="*{password}">
						<span class="focus-input100"></span>
						<span class="symbol-input100">
        <i class="fa fa-lock" aria-hidden="true"></i>
    </span>
					</div>

					<div class="container-login100-form-btn">
						<button class="login100-form-btn" type="submit" onclick="login()">
							Login
						</button>
					</div>

					<div class="text-center p-t-12">
						<span class="txt1">
							Forgot
						</span>
						<a class="txt2" href="#">
							Username / Password?
						</a>
					</div>

					<div class="text-center p-t-136">
						<a class="txt2" href="#">
							Create your Account
							<i class="fa fa-long-arrow-right m-l-5" aria-hidden="true"></i>
						</a>
					</div>
				</form>
			</div>
		</div>
	</div>


<!--===============================================================================================-->
	<script src="Login_v1/vendor/jquery/jquery-3.2.1.min.js"></script>
<!--===============================================================================================-->
	<script src="Login_v1/vendor/bootstrap/js/popper.js"></script>
	<script src="Login_v1/vendor/bootstrap/js/bootstrap.min.js"></script>
<!--===============================================================================================-->
	<script src="Login_v1/vendor/select2/select2.min.js"></script>
<!--===============================================================================================-->
	<script src="Login_v1/vendor/tilt/tilt.jquery.min.js"></script>
	<script >
		$('.js-tilt').tilt({
			scale: 1.1
		})
	</script>
<!--&lt;!&ndash;===============================================================================================&ndash;&gt;-->
<!--	<script src="Login_v1/js/main.js"></script>-->
<!--	<script src="Login_v1/js/login.js"></script>-->

	<script>
		function validateEmail(email) {
			// Biểu thức chính quy để kiểm tra định dạng email
			const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
			// Kiểm tra xem email có khớp với biểu thức chính quy không
			return emailRegex.test(email);
		}

		function login(event) {
			event.preventDefault();

			var email = document.getElementById("email").value;
			var password = document.getElementById("password").value;
			if(!validateEmail(email)){
				var element = document.getElementById("emailerror");
				element.innerHTML = "Email không hợp lệ";
				return;
			}
			var element = document.getElementById("emailerror");
			element.innerHTML = ""; // Xóa thông báo lỗi nếu email hợp lệ

			if(password.length < 6 || password.length > 30){
				var element = document.getElementById("passworderror");
				element.innerHTML = "Mật khẩu phải lớn hơn 6 ký tự và nhỏ hơn 30 ký tự";
				return;
			}
			var element = document.getElementById("passworderror");
			element.innerHTML = ""; // Xóa thông báo lỗi nếu mật khẩu hợp lệ

// Gửi request lên server
			document.getElementById("myForm").submit();
		}

		document.getElementById("submit").addEventListener("click", login);
	</script>

</body>
</html>
